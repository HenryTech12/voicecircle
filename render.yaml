services:
  - type: web
    name: voicecircle-api
    runtime: docker
    rootDir: api
    healthCheckPath: /api/v1/health
    envVars:
      - key: MOCK_PROVIDERS
        value: "true"
      - key: DEMO_MODE
        value: "true"
      - key: LOCAL_JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
  - type: web
    name: voicecircle-web
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
